<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- moire-dm-settings (docs/moire-dm.md): only its account may own the name; anyone may call
     it, and the service itself decides with the caller's credentials and polkit. -->
<busconfig>
  <policy user="moire-dm-settings">
    <allow own="org.moire.LoginManager1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.moire.LoginManager1"
           send_interface="org.moire.LoginManager1"/>
    <allow send_destination="org.moire.LoginManager1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
</busconfig>
