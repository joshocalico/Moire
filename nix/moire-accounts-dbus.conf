<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- moire-accounts (docs/polkit-agent.md, "One prompt per change"): only its account may own
     the name. People may call it; the service itself refuses accounts below uid 1000 and asks
     polkit, whose rule refuses anyone not in an active, local session. The greeter is refused
     here as well. -->
<busconfig>
  <policy user="moire-accounts">
    <allow own="org.moire.AccountAdmin1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.moire.AccountAdmin1"
           send_interface="org.moire.AccountAdmin1"/>
    <allow send_destination="org.moire.AccountAdmin1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
  <policy user="greeter">
    <deny send_destination="org.moire.AccountAdmin1"/>
  </policy>
</busconfig>
